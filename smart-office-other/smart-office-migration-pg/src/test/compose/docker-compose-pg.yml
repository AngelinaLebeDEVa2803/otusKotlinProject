version: '3.9'
services:
  psql:
    image: postgres
    #    ports:
    #      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "smart123"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "smartoffice_bookings"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  liquibase:
    image: "ok-marketplace-migration-pg:0.1.0"
    environment:
      LIQUIBASE_URL:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://psql:5432/smartoffice_bookings
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: "smart123"
      LIQUIBASE_LIQUIBASE_SCHEMA_NAME: public
    depends_on:
      psql:
        condition: service_healthy
