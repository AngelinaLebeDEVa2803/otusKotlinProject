server:
  port: 8080

management:
  endpoint:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: info,env,health

spring:
  jackson:
    default-property-inclusion: non_null

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    use-root-path: true
    urls:
      - name: v1
        url: specs-booking-v1.yaml

smartoffice:
  repository:
    test: "inmemory"
    prod: "$DB_TYPE_PROD:inmemory"

psql:
  schema: public
  database: "${OFFICEBOOKINGS_DB:smartoffice-bookings}"
  host: "${OFFICEBOOKINGS_HOST:localhost}"
  port: "${OFFICEBOOKINGS_PORT:5433}"
  user: "${OFFICEBOOKINGS_USER:postgres}"
  password: "${OFFICEBOOKINGS_PASS:smart123!}"